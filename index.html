            align-items: center;
            margin: 0;
            background: #ffffff;
            overflow-x: hidden;
            height: 100vh;
        }

        header {
            font-size: 36px;
            font-weight: bold;
            margin: 15px 0;
            border-bottom: 1px solid var(--tile-border);
            width: 100%;
            text-align: center;
            padding-bottom: 10px;
        }

        /* --- АНИМАЦИИ МОДАЛЬНОГО ОКНА --- */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes zoomIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        @keyframes fadeOut {
            from { opacity: 1; transform: scale(1); }
            to { opacity: 0; transform: scale(0.9); }
        }

        #custom-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 2000;
            display: none; 
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(2px);
        }

        #custom-modal.active {
            display: flex;
            animation: fadeIn 0.2s ease-out;
        }

        #custom-modal.active .modal-content {
            animation: zoomIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        #custom-modal.closing {
            animation: fadeIn 0.2s ease-in reverse forwards;
        }

        #custom-modal.closing .modal-content {
            animation: fadeOut 0.2s ease-in forwards;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            max-width: 350px;
            width: 90%;
        }

        input {
            padding: 15px;
            font-size: 18px;
            border: 1px solid #ccc;
            border-radius: 8px;
            margin-bottom: 15px;
            width: 80%;
            text-align: center;
            outline: none;
        }

        .btn {
            padding: 15px 25px;
            background: #1a1a1b;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            border-radius: 8px;
            width: 90%;
            margin: 5px 0;
            transition: background 0.2s, transform 0.1s;
        }

        .btn:hover { background: #333; }
        .btn:active { transform: scale(0.98); }

        .game-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
            overflow-x: auto;
            padding: 10px 0;
        }

        .game-container {
            display: flex;
            gap: 20px;
            padding: 0 20px;
        }

        .player-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: opacity 0.3s;
        }

        .player-block.inactive { opacity: 0.4; }

        .nickname-label {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #555;
        }

        .board {
            display: grid;
            grid-template-rows: repeat(6, 1fr);
            gap: 5px;
        }

        .row {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 5px;
        }

        .tile {
            width: 52px;
            height: 52px;
            border: 2px solid var(--tile-border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
            text-transform: uppercase;
            user-select: none;
        }

        .tile.pop { animation: pop 0.1s linear; border-color: #878a8c; }
        .tile.flip { animation: flip 0.5s ease-in; }
        @keyframes pop { 50% { transform: scale(1.1); } }
        @keyframes flip { 50% { transform: rotateX(90deg); } }
        
        .correct { background: var(--correct); border-color: var(--correct); color: white; }
        .present { background: var(--present); border-color: var(--present); color: white; }
        .absent { background: var(--absent); border-color: var(--absent); color: white; }

        .keyboard {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: auto;
            margin-bottom: 20px;
            width: 100%;
            max-width: 500px;
            padding: 0 10px;
        }
        .kbd-row { display: flex; justify-content: center; gap: 6px; }
        .key {
            background: var(--key-bg);
            border: none;
            border-radius: 4px;
            height: 58px;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            text-transform: uppercase;
        }
        .key.key-enter { flex: 1.5; font-size: 12px; }
        .key.key-back { flex: 1.5; }
        .key.correct { background: var(--correct); color: white; }
        .key.present { background: var(--present); color: white; }
        .key.absent { background: var(--kbd-absent); color: white; }
        .keyboard.disabled { opacity: 0.5; pointer-events: none; }

        #lobby-info { font-size: 14px; color: #777; margin-top: 10px; font-weight: bold; }
    </style>
</head>

        const inner = document.getElementById('modal-inner');
        
        modal.classList.remove('closing');
        modal.style.display = 'flex';
        modal.offsetHeight; 
        modal.classList.add('active');

        if (type === 'auth') {
            inner.innerHTML = `
                <h2>WORDLE</h2>
                <input type="text" id="nick-input" placeholder="ВАШ НИК" maxlength="10">
                <button class="btn" onclick="saveNickname()">ВОЙТИ</button>
            `;
        } else if (type === 'menu') {
            inner.innerHTML = `
                <h2>ПРИВЕТ, ${myNickname}!</h2>
                <button class="btn" onclick="createGame()">СОЗДАТЬ ЛОББИ</button>
                <div style="margin:10px">ИЛИ</div>
                <input type="text" id="code-input" placeholder="КОД ЛОББИ" maxlength="4">
                <button class="btn" onclick="joinByCode()">ПРИСОЕДИНИТЬСЯ</button>
            `;
        } else if (type === 'alert') {
            inner.innerHTML = `
                <h2>ВНИМАНИЕ</h2>
                <p>${msg}</p>
                <button class="btn" onclick="closeModal()">OK</button>
            `;
        } else if (type === 'gameover') {
            inner.innerHTML = `
                <h2>ИГРА ОКОНЧЕНА</h2>
                <p>${msg}</p>
                <button class="btn" onclick="location.reload()">В МЕНЮ</button>
            `;
        }
    }

    function closeModal(callback) {
        const modal = document.getElementById('custom-modal');
        modal.classList.remove('active');
        modal.classList.add('closing');
        
        setTimeout(() => {
            modal.style.display = 'none';
            modal.classList.remove('closing');
            if (callback) callback();
        }, 200);
    }

    function saveNickname() {
        const val = document.getElementById('nick-input').value.trim().toUpperCase();
        if (val.length < 2) return;
        myNickname = val;
        showModal('menu');
    }

    function setupKeyboard() {
        const rows = ["ЙЦУКЕНГШЩЗХЪ", "ФЫВАПРОЛДЖЭ", "ЯЧСМИТЬБЮ"];
        rows.forEach((r, i) => {
            const container = document.getElementById(`row${i+1}`);
            container.innerHTML = '';
            if(i === 2) createKey(container, "⌫", "key-back");
            r.split('').forEach(char => createKey(container, char));
            if(i === 2) createKey(container, "ВВОД", "key-enter");
        });
    }

    function createKey(container, text, extraClass = "") {
        const btn = document.createElement('button');
        btn.className = `key ${extraClass}`;
        btn.setAttribute('data-key', text);
        if (text === "⌫") {
            btn.innerHTML = `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zM18 9l-6 6M12 9l6 6"/></svg>`;
            btn.onclick = () => handleInput("BACK");
        } else {
            btn.textContent = text;
            btn.onclick = () => handleInput(text === "ВВОД" ? "ENTER" : text);
        }
        container.appendChild(btn);
    }

    function updateKeyboard(letter, status) {
        const keyBtn = document.querySelector(`.key[data-key="${letter}"]`);
        if (!keyBtn || keyStatus[letter] === 'correct') return;
        keyStatus[letter] = status;
        keyBtn.className = `key ${status}`;
    }

    async function createGame() {
        lobbyId = Math.floor(1000 + Math.random() * 9000);
        targetWord = WORDS[Math.floor(Math.random() * WORDS.length)];
        myPlayerIndex = 0;
        await db.ref('lobbies/' + lobbyId).set({
            target: targetWord,
            players: [myNickname, "", ""],
            turn: 0,
            status: "waiting"
        });
        startGameUI();
    }

    async function joinByCode() {
        const code = document.getElementById('code-input').value.trim();
        const snap = await db.ref('lobbies/' + code).once('value');
        if (!snap.exists()) return showModal('alert', "Нет такого лобби!");
        const data = snap.val();
        let slot = data.players.indexOf("");
        if (slot === -1) return showModal('alert', "Лобби уже заполнено!");

        lobbyId = code;
        myPlayerIndex = slot;
        await db.ref(`lobbies/${lobbyId}/players/${slot}`).set(myNickname);
        if (slot === 2) await db.ref(`lobbies/${lobbyId}/status`).set("playing");
        startGameUI();
    }

    function startGameUI() {
        closeModal(() => {
            document.getElementById('game-header').textContent = `КОД: ${lobbyId}`;
            const main = document.getElementById('game-main');
            main.innerHTML = '';
            for(let i=0; i<3; i++) {
                gameState[i] = { row: 0, col: 0 };
                const block = document.createElement('div');
                block.className = 'player-block inactive';
                block.id = `player-block-${i}`;
                block.innerHTML = `<div class="nickname-label" id="label-${i}">...</div>
                    <div class="board">${Array(6).fill('<div class="row">'+Array(5).fill('<div class="tile"></div>').join('')+'</div>').join('')}</div>`;
                main.appendChild(block);
            }
            setupKeyboard();
            listenToFirebase();
        });
    }

    function listenToFirebase() {
        db.ref('lobbies/' + lobbyId).on('value', (snap) => {
            const data = snap.val();
            if (!data) return;
            currentPlayerIndex = data.turn;
            targetWord = data.target;
            
            const isReady = !data.players.includes("");
            const isMyTurn = isReady && currentPlayerIndex === myPlayerIndex && data.status === "playing";
            document.getElementById('main-keyboard').classList.toggle('disabled', !isMyTurn);
            document.getElementById('lobby-info').textContent = isReady ? (isMyTurn ? "ВАШ ХОД" : "ХОД СОПЕРНИКА") : "ЖДЕМ ИГРОКОВ...";

            data.players.forEach((name, i) => {
                const label = document.getElementById(`label-${i}`);
                if (label) {
                    label.textContent = name || "ОЖИДАНИЕ...";
                    document.getElementById(`player-block-${i}`).classList.toggle('inactive', isReady && i !== currentPlayerIndex);
                }
            });

            if (data.lastMove && data.lastMove.playerIndex !== myPlayerIndex) {
                renderMove(data.lastMove);
            }
            if (data.status === "finished" && !isGameOver) {
                isGameOver = true;
                showModal('gameover', "СЛОВО БЫЛО: " + targetWord);
            }
        });
    }

    function handleInput(key) {
        // Если уже обрабатываем нажатие - игнорируем всё
        if (isProcessing) return;

        let state = gameState[myPlayerIndex];
        const playerBlock = document.getElementById(`player-block-${myPlayerIndex}`);
        if(!playerBlock) return;
        const rows = playerBlock.querySelectorAll('.row');
        const tiles = rows[state.row].querySelectorAll('.tile');

        if (key === "ENTER") {
            if (state.col === 5) checkWord();
        } else if (key === "BACK") {
            if (state.col > 0) { 
                state.col--; 
                tiles[state.col].textContent = ""; 
                tiles[state.col].classList.remove('pop'); 
            }
        } else if (state.col < 5) {
            tiles[state.col].textContent = key;
            tiles[state.col].classList.add('pop');
            state.col++;
        }
    }

    async function checkWord() {
        // Блокируем ввод на время анимации и запроса
        isProcessing = true;

        let state = gameState[myPlayerIndex];
        const rowElement = document.getElementById(`player-block-${myPlayerIndex}`).querySelectorAll('.row')[state.row];
        const tiles = rowElement.querySelectorAll('.tile');
        let guess = Array.from(tiles).map(t => t.textContent).join('');

        let results = Array(5).fill('absent');
        let tempTarget = targetWord.split('');

        // 1. Проход на совпадения
        tiles.forEach((t, i) => {
            if (guess[i] === targetWord[i]) {
                results[i] = 'correct';
                tempTarget[i] = null;
            }
        });

        // 2. Проход на наличие букв
        tiles.forEach((t, i) => {
            if (results[i] !== 'correct' && tempTarget.includes(guess[i])) {
                results[i] = 'present';
                tempTarget[tempTarget.indexOf(guess[i])] = null;
            }
        });

        // 3. Анимация
        tiles.forEach((t, i) => {
            setTimeout(() => {
                t.classList.add('flip');
                setTimeout(() => {
                    t.classList.add(results[i]);
                    updateKeyboard(guess[i], results[i]);
                }, 250);
            }, i * 100);
        });

        const isWin = guess === targetWord;
        
        // 4. Обновление базы и снятие блокировки
        setTimeout(async () => {
            if (isWin) {
                confetti();
                await db.ref(`lobbies/${lobbyId}`).update({ status: "finished" });
            } else {
                const next = (myPlayerIndex + 1) % 3;
                await db.ref(`lobbies/${lobbyId}`).update({
                    turn: next,
                    lastMove: { playerIndex: myPlayerIndex, guess, results, row: state.row }
                });
                state.row++; 
                state.col = 0;
            }
            // РАЗБЛОКИРУЕМ ввод
            isProcessing = false;
        }, 1500);
    }

    function renderMove(move) {
        if (gameState[move.playerIndex].row > move.row) return; 
        const block = document.getElementById(`player-block-${move.playerIndex}`);
        if(!block) return;
        const tiles = block.querySelectorAll('.row')[move.row].querySelectorAll('.tile');
        move.guess.split('').forEach((char, i) => {
            tiles[i].textContent = char;
            tiles[i].classList.add(move.results[i]);
        });
        gameState[move.playerIndex].row = move.row + 1;
    }

    // Инициализация
    showModal('auth');

    window.onkeydown = (e) => {
        // Если ввод заблокирован флагом или стилем - ничего не делаем
        if (isProcessing || document.getElementById('main-keyboard').classList.contains('disabled')) return;
        
        if (e.key === "Enter") handleInput("ENTER");
        else if (e.key === "Backspace") handleInput("BACK");
        else if (/^[а-яёА-ЯЁ]$/.test(e.key)) handleInput(e.key.toUpperCase());
    };
</script>
